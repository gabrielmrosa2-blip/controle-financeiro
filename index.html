function status(x){if(x.pagamento)return'PAGO';const d=x.data||x.vencimento;return d<today()?'ATRASADO':'EM DIA'}
function pill(s){return `<span class="pill ${s==='PAGO'?'green':s==='ATRASADO'?'red':''}">${s}</span>`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function setPage(p){state.page=p;renderShell();renderPage()}
function switchArea(a){state.area=a;state.page='dashboard';renderShell();renderPage()}
function monthLabel(m){const [y,n]=m.split('-');return new Date(+y,+n-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
function monthMove(m,delta){const [y,n]=m.split('-').map(Number),d=new Date(y,n-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function navItems(){return state.area==='pessoal'
 ? [['dashboard','⌂','Início'],['lancamentos','▤','Lançamentos'],['parcelamentos','▦','Parcelamentos'],['relatorios','◫','Relatórios'],['calendario','▣','Calendário'],['config','⚙','Configurações']]
 : [['dashboard','⌂','Dashboard'],['membros','♙','Membros'],['mensalidades','◷','Mensalidades'],['lancmembros','＋','Lançamentos'],['historico','▤','Histórico'],['config','⚙','Configurações']]}

function renderShell(){
 document.getElementById('sideArea').textContent=state.area==='pessoal'?'Controle Pessoal':'Controle do Terreiro';
 document.getElementById('eyebrow').textContent=state.area==='pessoal'?'CONTROLE PESSOAL':'CONTROLE DO TERREIRO';
 const titles={dashboard:'Dashboard',lancamentos:'Lançamentos',parcelamentos:'Parcelamentos',relatorios:'Relatórios',calendario:'Calendário Financeiro',config:'Configurações',membros:'Membros',mensalidades:'Mensalidades',lancmembros:'Lançamentos dos membros',historico:'Histórico'};
 document.getElementById('pageTitle').textContent=titles[state.page]||'Controle+';
 document.getElementById('subtitle').textContent=state.area==='pessoal'?`Visão de ${monthLabel('2026-09')}`:'Gestão independente do Terreiro';
 const side=document.getElementById('sideNav');side.innerHTML=navItems().map(([p,i,n])=>`<button class="${state.page===p?'active':''}" onclick="setPage('${p}')"><span class="icon">${i}</span>${n}</button>`).join('');
 const mobile=document.getElementById('mobileNav');let items=state.area==='pessoal'?navItems().slice(0,5):navItems().slice(0,5);
 mobile.innerHTML=items.map(([p,i,n])=>`<button class="${state.page===p?'active':''}" onclick="setPage('${p}')"><span class="mi">${i}</span>${n}</button>`).join('')+`<button onclick="switchArea('${state.area==='pessoal'?'terreiro':'pessoal'}')"><span class="mi">${state.area==='pessoal'?'⛩':'$'}</span>${state.area==='pessoal'?'Terreiro':'Pessoal'}</button>`;
 document.getElementById('headerAction').style.display=state.page==='dashboard'||state.page==='lancamentos'||state.page==='parcelamentos'||state.page==='lancmembros'?'block':'none';
 document.getElementById('headerAction').textContent=state.area==='terreiro'?'＋ Novo lançamento':'＋ Novo lançamento';
}
function renderPage(){
 const pages=document.getElementById('pages');pages.innerHTML='';
 if(state.area==='pessoal') renderPersonalPages(pages); else renderTerreiroPages(pages);
 const el=pages.querySelector('#page-'+state.page)||pages.querySelector('#page-dashboard');if(el)el.classList.add('active');
 bindDateEvents();
}
function renderPersonalPages(p){
 p.innerHTML=`${dashboardPersonal()}${lancamentosPage()}${parcelamentosPage()}${relatoriosPage()}${calendarioPage()}${configPage()}`;
}
function renderTerreiroPages(p){
 p.innerHTML=`${dashboardTerreiro()}${membrosPage()}${mensalidadesPage()}${lancMembrosPage()}${historicoPage()}${configPage()}`;
}
function dashboardPersonal(){
 const m='2026-09', arr=data.lancamentos.filter(x=>x.data.startsWith(m)), rec=arr.filter(x=>x.tipo==='RECEITA').reduce((a,x)=>a+x.valor,0),des=arr.filter(x=>x.tipo==='DESPESA').reduce((a,x)=>a+Math.abs(x.valor),0);
 const aberto=arr.filter(x=>!x.pagamento&&x.tipo==='DESPESA').reduce((a,x)=>a+Math.abs(x.valor),0)+data.parcelas.filter(x=>!x.pagamento&&x.vencimento.startsWith(m)).reduce((a,x)=>a+Math.abs(x.valor),0);
 const saldo=rec-des;
 const recent=[...arr].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,6);
 const cat={};arr.filter(x=>x.tipo==='DESPESA').forEach(x=>cat[x.categoria]=(cat[x.categoria]||0)+Math.abs(x.valor));const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=cats[0]?.[1]||1;
 const prox=[...data.lancamentos.filter(x=>!x.pagamento),...data.parcelas.filter(x=>!x.pagamento)].sort((a,b)=>(a.data||a.vencimento).localeCompare(b.data||b.vencimento)).slice(0,5);
 return `<section class="page" id="page-dashboard">
 <div class="cards">
  <div class="card primary"><div class="kicker"><span class="label">Saldo do mês</span><span class="mini">SET/26</span></div><div class="money">${money(saldo)}</div></div>
  <div class="card"><div class="label">Receitas</div><div class="money green">${money(rec)}</div><small style="color:var(--muted)">Entradas do mês</small></div>
  <div class="card"><div class="label">Despesas</div><div class="money red">${money(des)}</div><small style="color:var(--muted)">Saídas do mês</small></div>
  <div class="card"><div class="label">Em aberto</div><div class="money amber">${money(aberto)}</div><small style="color:var(--muted)">A vencer ou atrasado</small></div>
 </div>
 <div class="section"><div class="section-head"><h2>Acesso rápido</h2></div><div class="quick-actions">
  <button class="quick" onclick="quickNew('DESPESA')"><b>− Nova despesa</b><small>Registrar saída</small></button>
  <button class="quick" onclick="quickNew('RECEITA')"><b>＋ Nova receita</b><small>Registrar entrada</small></button>
  <button class="quick" onclick="setPage('lancamentos')"><b>▤ Ver lançamentos</b><small>Contas e movimentações</small></button>
  <button class="quick" onclick="setPage('calendario')"><b>▣ Ver calendário</b><small>Agenda financeira</small></button>
 </div></div>
 <div class="grid2">
  <div class="section"><div class="section-head"><h2>Movimentações recentes</h2><button class="link" onclick="setPage('lancamentos')">Ver todas →</button></div>
  ${recent.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.descricao)}</b><small>${esc(x.categoria)} · ${fmt(x.data)}</small></div><div class="row-right"><b class="${x.tipo==='RECEITA'?'green':'red'}">${money(x.valor)}</b><div>${pill(status(x))}</div></div></div>`).join('')||empty()}</div>
  <div class="section"><div class="section-head"><h2>Despesas por categoria</h2><button class="link" onclick="setPage('relatorios')">Detalhes →</button></div>
  ${cats.map(([k,v])=>`<div style="margin:12px 0"><div class="row" style="padding:0;border:0"><span style="font-size:12px">${esc(k)}</span><b style="font-size:12px">${money(v)}</b></div><div class="progress"><i style="width:${v/mx*100}%"></i></div></div>`).join('')||empty()}</div>
 </div>
 <div class="section"><div class="section-head"><h2>Próximos pagamentos</h2></div>
 ${prox.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.descricao)}</b><small>${fmt(x.data||x.vencimento)}</small></div><div class="row-right"><b>${money(Math.abs(x.valor))}</b><br>${pill(status(x))}</div></div>`).join('')||empty()}</div>
 </section>`;
}
function lancamentosPage(){
 const years=[...new Set(data.lancamentos.map(x=>(x.data||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
 if(state.lancYear && !years.includes(state.lancYear)) state.lancYear='';
 const filtered=data.lancamentos.filter(x=>
  (!state.lancSearch||`${x.descricao||''} ${x.categoria||''}`.toLowerCase().includes(state.lancSearch))&&
  (!state.lancTipo||x.tipo===state.lancTipo)&&
  (!state.lancStatus||status(x)===state.lancStatus)&&
  (!state.lancYear||(x.data||'').startsWith(state.lancYear))
 ).sort((a,b)=>a.data.localeCompare(b.data));
 return `<section class="page" id="page-lancamentos"><div class="section"><div class="section-head"><div><h2>Lançamentos</h2><small style="color:var(--muted)">Controle pessoal · ${filtered.length} registro${filtered.length===1?'':'s'}</small></div><button class="btn" onclick="quickNew()">＋ Novo</button></div>
 <div class="toolbar compact-toolbar"><input class="field search" placeholder="Pesquisar..." value="${esc(state.lancSearch)}" oninput="state.lancSearch=this.value.toLowerCase();renderPage()"><select class="select" onchange="state.lancYear=this.value;renderPage()"><option value="">Ano: todos</option>${years.map(y=>`<option value="${y}" ${state.lancYear===y?'selected':''}>${y}</option>`).join('')}</select><select class="select" onchange="state.lancTipo=this.value;renderPage()"><option value="">Tipo: todos</option><option value="RECEITA" ${state.lancTipo==='RECEITA'?'selected':''}>Receitas</option><option value="DESPESA" ${state.lancTipo==='DESPESA'?'selected':''}>Despesas</option></select></div>
 <div class="toolbar compact-filters"><div class="filter-group">${[['','Todos'],['PAGO','Pago'],['EM DIA','Em dia'],['ATRASADO','Atrasado']].map(([v,n])=>`<button class="filter ${state.lancStatus===v?'active':''}" onclick="state.lancStatus='${v}';renderPage()">${n}</button>`).join('')}</div></div>
 <div class="launch-list">
 ${filtered.map(x=>`<div class="launch-compact">
   <div class="launch-top"><div class="launch-title"><span class="badge-type ${x.tipo==='RECEITA'?'r':'d'}">${x.tipo==='RECEITA'?'R':'D'}</span><b>${esc(x.descricao)}</b></div><b class="${x.tipo==='RECEITA'?'green':'red'}">${money(x.valor)}</b></div>
   <div class="launch-meta"><span>Venc. ${fmt(x.data)}</span><span>${esc(x.categoria)}</span><span>${pill(status(x))}</span></div>
   <div class="launch-bottom"><div><small>Pagamento</small>${dateControl('l',x.id,x.pagamento)}</div><button class="icon-btn" title="Repetir lançamento" aria-label="Repetir lançamento" onclick="repeatLaunch('${x.id}')">＋</button></div>
 </div>`).join('')||empty('Nenhum lançamento encontrado.')}
 </div></div></section>`;
}
function dashboardTerreiro(){
 const m=state.memberMonth,members=data.membros||[], paid=members.filter(x=>memberStatus(x,m)==='PAGO').length, late=members.filter(x=>memberStatus(x,m)==='ATRASADO').length,on=members.filter(x=>memberStatus(x,m)==='EM DIA').length;
 const total=members.reduce((a,x)=>a+Number(x.valor||0),0), received=members.filter(x=>memberStatus(x,m)==='PAGO').reduce((a,x)=>a+Number(x.valor||0),0);
 return `<section class="page" id="page-dashboard"><div class="terreiro-banner"><div><div class="eyebrow">GESTÃO INDEPENDENTE</div><h2 style="margin:4px 0;font-size:24px">Controle do Terreiro</h2><div style="color:#aab7ca;font-size:12px">${monthLabel(m)} · ${members.length} membros cadastrados</div></div><button class="btn gold" onclick="openMemberModal()">＋ Novo membro</button></div>
 <div class="cards" style="grid-template-columns:repeat(4,1fr);margin-top:16px"><div class="card"><div class="label">Membros</div><div class="money">${members.length}</div></div><div class="card"><div class="label">Pagos</div><div class="money green">${paid}</div></div><div class="card"><div class="label">Em dia</div><div class="money amber">${on}</div></div><div class="card"><div class="label">Atrasados</div><div class="money red">${late}</div></div></div>
 <div class="grid2"><div class="section"><div class="section-head"><h2>Mensalidades · ${monthLabel(m)}</h2><button class="link" onclick="setPage('mensalidades')">Abrir →</button></div>${members.slice(0,8).map(x=>`<div class="row"><div class="row-main"><b>${esc(x.nome)}</b><small>R$ ${Number(x.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})} · vence dia ${x.dia}</small></div><div class="row-right">${pill(memberStatus(x,m))}</div></div>`).join('')||empty('Cadastre os membros para começar.')}</div>
 <div class="section"><div class="section-head"><h2>Resumo financeiro</h2></div><div class="row"><span>Previsto</span><b>${money(total)}</b></div><div class="row"><span>Recebido</span><b class="green">${money(received)}</b></div><div class="row"><span>Pendente</span><b class="amber">${money(total-received)}</b></div><button class="btn" style="width:100%;margin-top:12px" onclick="switchArea('pessoal')">Ir para Controle Pessoal</button></div></div>
 </section>`;
}
function membrosPage(){
 const m=state.memberMonth;
 return `<section class="page" id="page-membros"><div class="section"><div class="section-head"><div><h2>Membros</h2><small style="color:var(--muted)">Mensalidade e histórico ficam vinculados a cada membro</small></div><button class="btn gold" onclick="openMemberModal()">＋ Novo membro</button></div><div class="toolbar"><select class="select" onchange="state.memberMonth=this.value;renderPage()">${monthOptions(2026,2028,m)}</select><input class="field search" placeholder="Pesquisar membro..." oninput="state.memberSearch=this.value.toLowerCase();renderPage()"></div><div class="member-grid">${(data.membros||[]).filter(x=>!state.memberSearch||x.nome.toLowerCase().includes(state.memberSearch)).map(x=>`<div class="member-card"><div class="topline"><h3>${esc(x.nome)}</h3>${pill(memberStatus(x,m))}</div><p>Mensalidade: <b>${money(x.valor)}</b> · vencimento dia ${x.dia}</p><p>Pago em: ${fmt(memberPayment(x,m))}</p><div style="display:flex;gap:7px;margin-top:12px"><button class="btn" style="padding:8px 10px;font-size:11px" onclick="payMember('${x.id}')">Pagar</button><button class="btn secondary" style="padding:8px 10px;font-size:11px" onclick="memberDetail('${x.id}')">Ver dados</button></div></div>`).join('')||empty('Nenhum membro cadastrado.')}</div></div></section>`;
}
function mensalidadesPage(){return membrosPage().replace('id="page-membros"','id="page-mensalidades"').replace('<h2>Membros</h2>','<h2>Mensalidades</h2>')}
function lancMembrosPage(){
 return `<section class="page" id="page-lancmembros"><div class="section"><div class="section-head"><div><h2>Lançamentos dos membros</h2><small style="color:var(--muted)">Não entram no Controle Financeiro Pessoal</small></div><button class="btn gold" onclick="openMemberTxnModal()">＋ Novo lançamento</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Membro</th><th>Descrição</th><th>Valor</th><th>Tipo</th></tr></thead><tbody>${(data.lancMembros||[]).sort((a,b)=>b.data.localeCompare(a.data)).map(x=>`<tr><td>${fmt(x.data)}</td><td>${esc((data.membros.find(m=>m.id===x.membroId)||{}).nome||'—')}</td><td>${esc(x.descricao)}</td><td><b>${money(x.valor)}</b></td><td>${esc(x.tipo||'OUTRO')}</td></tr>`).join('')||`<tr><td colspan="5">${empty('Nenhum lançamento dos membros.')}</td></tr>`}</tbody></table></div></div></section>`;
}
function historicoPage(){
 const members=data.membros||[];
 return `<section class="page" id="page-historico"><div class="section"><div class="section-head"><h2>Histórico do Terreiro</h2></div>${members.map(m=>`<div class="row"><div class="row-main"><b>${esc(m.nome)}</b><small>Mensalidade ${money(m.valor)} · dia ${m.dia}</small></div><button class="link" onclick="memberDetail('${m.id}')">Abrir histórico →</button></div>`).join('')||empty()}</div></section>`;
}
function empty(t='Nenhum registro encontrado.'){return `<div class="empty">${t}</div>`}
function monthOptions(start,end,selected){let s='';for(let y=start;y<=end;y++)for(let m=1;m<=12;m++){const v=`${y}-${String(m).padStart(2,'0')}`;s+=`<option value="${v}" ${selected===v?'selected':''}>${monthLabel(v)}</option>`}return s}
function payButton(kind,id){return `<button class="btn" style="padding:8px 11px;font-size:11px" onclick="payItem('${kind}','${id}')">Pagar</button>`}
function dateControl(kind,id,value){return `<div class="date-control"><input type="date" value="${value||''}" data-kind="${kind}" data-id="${id}" aria-label="Data de pagamento"><button class="clear-date" type="button" onclick="clearPayment('${kind}','${id}')">×</button></div>`}
function bindDateEvents(){document.querySelectorAll('input[type=date][data-kind]').forEach(el=>el.addEventListener('change',()=>setPayment(el.dataset.kind,el.dataset.id,el.value||null)))}
function findItem(kind,id){return kind==='l'?data.lancamentos.find(x=>x.id===id):data.parcelas.find(x=>x.id===id)}
function setPayment(kind,id,val){const x=findItem(kind,id);if(!x)return;x.pagamento=val||null;persist();renderPage();toast(val?'Pagamento registrado':'Data de pagamento apagada')}
function clearPayment(kind,id){setPayment(kind,id,null)}
function payItem(kind,id){setPayment(kind,id,today())}
function repeatLaunch(id){const x=data.lancamentos.find(y=>y.id===id);if(!x)return;openRepeatModal(x)}
function quickNew(tipo='DESPESA'){openLaunchModal(tipo)}
function openLaunchModal(tipo='DESPESA'){
 document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>Novo lançamento</h2><button class="close" onclick="closeModal()">×</button></div>
 <form class="form-grid" onsubmit="saveLaunch(event)">
 <div class="form-group full"><label>Tipo</label><div class="segment"><button type="button" class="${tipo==='RECEITA'?'active r':''}" onclick="selectLaunchType(this,'RECEITA')">Receita</button><button type="button" class="${tipo==='DESPESA'?'active d':''}" onclick="selectLaunchType(this,'DESPESA')">Despesa</button></div><input id="launchType" type="hidden" value="${tipo}"></div>
 <div class="form-group"><label>Vencimento</label><input id="lData" type="date" value="${today()}" required></div>
 <div class="form-group"><label>Valor</label><input id="lValor" type="number" step="0.01" min="0" placeholder="0,00" required></div>
 <div class="form-group"><label>Categoria</label><select id="lCat">${data.categorias.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
 <div class="form-group"><label>Descrição</label><input id="lDesc" placeholder="Ex.: Mercado, salário..." required></div>
 <div class="form-group full"><label>Data de pagamento <span style="font-weight:500">(opcional)</span></label><input id="lPgto" type="date"></div>
 <div class="form-group full"><label>Repetir lançamento</label><select id="lRepeat"><option value="1">Não repetir</option><option value="2">2 meses</option><option value="3">3 meses</option><option value="6">6 meses</option><option value="12">12 meses</option></select></div>
 <div class="form-group full"><button class="btn" style="width:100%">Salvar lançamento</button></div></form>`;
 showModal();
}
function selectLaunchType(btn,type){document.querySelectorAll('.segment button').forEach(b=>b.classList.remove('active','r','d'));btn.classList.add('active',type==='RECEITA'?'r':'d');document.getElementById('launchType').value=type}
function saveLaunch(e){e.preventDefault();const type=document.getElementById('launchType').value,d=document.getElementById('lData').value,v=Math.abs(+document.getElementById('lValor').value),cat=document.getElementById('lCat').value,desc=document.getElementById('lDesc').value.trim(),pg=document.getElementById('lPgto').value||null,n=+document.getElementById('lRepeat').value;for(let i=0;i<n;i++){const dt=new Date(d+'T12:00:00');dt.setMonth(dt.getMonth()+i);data.lancamentos.unshift({id:'l'+Date.now()+i,data:dt.toISOString().slice(0,10),tipo:type,categoria:cat,descricao:desc,valor:type==='DESPESA'?-v:v,pagamento:i===0?pg:null})}persist();closeModal();renderPage();toast('Lançamento salvo')}
function openParcelModal(){
 document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>Novo parcelamento</h2><button class="close" onclick="closeModal()">×</button></div>
 <form class="form-grid" onsubmit="saveParcel(event)">
 <div class="form-group full"><label>Descrição</label><input id="pDesc" placeholder="Ex.: Espaço Laser" required></div>
 <div class="form-group"><label>Valor da parcela</label><input id="pValor" type="number" min="0" step=".01" placeholder="0,00" required></div>
 <div class="form-group"><label>Quantidade de parcelas</label><input id="pQtd" type="number" min="1" max="240" value="6" required></div>
 <div class="form-group"><label>Primeiro vencimento</label><input id="pData" type="date" value="${today()}" required></div>
 <div class="form-group"><label>Data de pagamento da 1ª parcela <span style="font-weight:500">(opcional)</span></label><input id="pPgto" type="date"></div>
 <div class="form-group full"><div class="info">As parcelas seguintes serão criadas automaticamente mês a mês. Cada parcela poderá receber sua própria data de pagamento.</div></div>
 <div class="form-group full"><button class="btn" style="width:100%">Criar parcelamento</button></div></form>`;
 showModal();
}
function saveParcel(e){e.preventDefault();const desc=document.getElementById('pDesc').value.trim(),v=-Math.abs(+document.getElementById('pValor').value),q=+document.getElementById('pQtd').value,d=document.getElementById('pData').value,pg=document.getElementById('pPgto').value||null;for(let i=0;i<q;i++){const dt=new Date(d+'T12:00:00');dt.setMonth(dt.getMonth()+i);data.parcelas.push({id:'p'+Date.now()+i,descricao:desc,parcela:i+1,total:q,vencimento:dt.toISOString().slice(0,10),valor:v,pagamento:i===0?pg:null})}persist();closeModal();renderPage();toast(`${q} parcelas criadas`)}
function openRepeatModal(x){
 document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>Repetir lançamento</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:13px;margin-top:0"><b>${esc(x.descricao)}</b> · ${money(x.valor)}</p><form onsubmit="saveRepeat(event,'${x.id}')"><div class="form-group"><label>Quantas vezes?</label><select id="repeatN"><option>2</option><option>3</option><option>6</option><option>12</option><option>24</option></select></div><div style="margin-top:15px"><button class="btn" style="width:100%">Criar repetições</button></div></form>`;
 showModal();
}
function saveRepeat(e,id){e.preventDefault();const x=data.lancamentos.find(y=>y.id===id),n=+document.getElementById('repeatN').value;for(let i=1;i<=n;i++){const dt=new Date(x.data+'T12:00:00');dt.setMonth(dt.getMonth()+i);data.lancamentos.unshift({...x,id:'l'+Date.now()+i,data:dt.toISOString().slice(0,10),pagamento:null})}persist();closeModal();renderPage();toast(`${n} repetições criadas`)}
function openMemberModal(){
 document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>Novo membro</h2><button class="close" onclick="closeModal()">×</button></div><form class="form-grid" onsubmit="saveMember(event)"><div class="form-group full"><label>Nome</label><input id="memNome" required></div><div class="form-group"><label>Valor mensal</label><input id="memValor" type="number" min="0" step=".01" required></div><div class="form-group"><label>Dia do vencimento</label><input id="memDia" type="number" min="1" max="31" value="10" required></div><div class="form-group full"><button class="btn gold" style="width:100%">Salvar membro</button></div></form>`;
 showModal();
}
function saveMember(e){e.preventDefault();data.membros.push({id:'m'+Date.now(),nome:document.getElementById('memNome').value.trim(),valor:+document.getElementById('memValor').value,dia:+document.getElementById('memDia').value,pagamentos:{}});persist();closeModal();renderPage();toast('Membro cadastrado')}
function memberStatus(m,month){const pg=m.pagamentos?.[month];if(pg)return'PAGO';const [y,mo]=month.split('-').map(Number),day=Math.min(m.dia,new Date(y,mo,0).getDate()),due=`${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;return due<today()?'ATRASADO':'EM DIA'}
function memberPayment(m,month){return m.pagamentos?.[month]||null}
function payMember(id){const m=data.membros.find(x=>x.id===id);if(!m)return;if(!m.pagamentos)m.pagamentos={};m.pagamentos[state.memberMonth]=today();persist();renderPage();toast(`Mensalidade de ${m.nome} paga`)}
function openMemberTxnModal(){
 document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>Lançamento do membro</h2><button class="close" onclick="closeModal()">×</button></div><form class="form-grid" onsubmit="saveMemberTxn(event)"><div class="form-group"><label>Membro</label><select id="txMem">${data.membros.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></div><div class="form-group"><label>Data</label><input id="txData" type="date" value="${today()}" required></div><div class="form-group"><label>Valor</label><input id="txValor" type="number" step=".01" required></div><div class="form-group"><label>Tipo</label><select id="txTipo"><option>AJUDA</option><option>DOAÇÃO</option><option>OUTRO</option></select></div><div class="form-group full"><label>Descrição</label><input id="txDesc" placeholder="Ex.: ajuda obra" required></div><div class="form-group full"><button class="btn gold" style="width:100%">Salvar lançamento</button></div></form>`;
 showModal();
}
function saveMemberTxn(e){e.preventDefault();data.lancMembros.push({id:'t'+Date.now(),membroId:document.getElementById('txMem').value,data:document.getElementById('txData').value,valor:+document.getElementById('txValor').value,descricao:document.getElementById('txDesc').value.trim(),tipo:document.getElementById('txTipo').value});persist();closeModal();renderPage();toast('Lançamento do Terreiro salvo')}
function memberDetail(id){const m=data.membros.find(x=>x.id===id),tx=(data.lancMembros||[]).filter(x=>x.membroId===id).sort((a,b)=>b.data.localeCompare(a.data));if(!m)return;const months=Object.entries(m.pagamentos||{}).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>${esc(m.nome)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="cards" style="grid-template-columns:1fr 1fr"><div class="card"><div class="label">Mensalidade</div><div class="money">${money(m.valor)}</div></div><div class="card"><div class="label">Vencimento</div><div class="money">Dia ${m.dia}</div></div></div><div class="section" style="box-shadow:none"><h3>Pagamentos mensais</h3>${months.map(([mo,d])=>`<div class="row"><span>${monthLabel(mo)}</span><span class="green">${fmt(d)} · PAGO</span></div>`).join('')||empty('Nenhuma mensalidade paga registrada.')}</div><div class="section" style="box-shadow:none"><h3>Outros lançamentos</h3>${tx.map(x=>`<div class="row"><span><b>${esc(x.descricao)}</b><small>${fmt(x.data)} · ${x.tipo}</small></span><b>${money(x.valor)}</b></div>`).join('')||empty('Nenhum outro lançamento.')}</div>`;showModal()}
function calendarDay(ds){const items=[...data.lancamentos.filter(x=>x.data===ds),...data.parcelas.filter(x=>x.vencimento===ds)];const d=document.getElementById('calendarDetail');if(!d)return;d.innerHTML=`<div class="detail-list"><h3>Lançamentos de ${fmt(ds)}</h3>${items.map(x=>`<div class="row"><span><b>${esc(x.descricao)}</b><small>${money(x.valor)}</small></span>${pill(status(x))}</div>`).join('')||empty()}</div>`}
function manageCategories(){document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h2>Categorias</h2><button class="close" onclick="closeModal()">×</button></div><div class="toolbar"><input id="newCat" class="field search" placeholder="Nova categoria"><button class="btn" onclick="addCategory()">Adicionar</button></div><div class="filter-group">${data.categorias.map(c=>`<button class="filter active" onclick="removeCategory('${esc(c)}')">${esc(c)} ×</button>`).join('')}</div>`;showModal()}
function addCategory(){const v=document.getElementById('newCat').value.trim().toUpperCase();if(v&&!data.categorias.includes(v)){data.categorias.push(v);persist();manageCategories();toast('Categoria adicionada')}}
function removeCategory(c){if(data.categorias.length<=1)return;data.categorias=data.categorias.filter(x=>x!==c);persist();manageCategories()}
function exportJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`controle-plus-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exportado')}
function restoreJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.lancamentos||!x.parcelas)throw Error();data=x;persist();renderPage();toast('Backup restaurado')}catch(_){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function resetData(){if(confirm('Restaurar os dados iniciais? Os dados criados neste dispositivo serão substituídos.')){data=structuredClone(seed);persist();renderPage();toast('Dados iniciais restaurados')}}
function toggleDark(btn){const on=document.body.classList.toggle('dark');localStorage.setItem('controle_dark',on?'1':'0');btn.classList.toggle('on',on)}
function showModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){renderShell();renderPage()}
if(localStorage.getItem('controle_dark')==='1')document.body.classList.add('dark');
render();
</script>
</body>
</html>
